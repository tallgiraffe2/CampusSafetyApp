<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beaver Safety | Oregon State University</title>
  <!-- Leaflet needs to load before the map setup in app.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header>
    <div class="container">
      <p>Oregon State University · Corvallis</p>
      <h1>Beaver Safety</h1>
    </div>
  </header>
  <main class="container">
    <section aria-labelledby="map-heading">
      <h2 id="map-heading">Campus map</h2>
      <p id="map-instructions">Move the mouse over the map and press <kbd>P</kbd> to drop a pin at the pointer. Drag the pin to adjust its location.</p>
      <div id="map" role="region" aria-labelledby="map-heading" aria-describedby="map-instructions"></div>
      <p id="report-status" role="status"></p>
    </section>
  </main>
  <template id="report-template">
    <form id="report-form" aria-labelledby="report-heading">
      <h3 id="report-heading">Report an incident</h3>
      <p id="location" role="status"></p>
      <label for="occurred-date">Date of occurrence</label>
      <input id="occurred-date" type="date" required>
      <label for="occurred-time">Time of occurrence (local time)</label>
      <input id="occurred-time" type="time" required>
      <label for="description">Description</label>
      <textarea id="description" rows="4" maxlength="2000" required></textarea>
      <button class="primary" type="submit">Save report</button>
      <p class="note">Reports stay in this browser and aren't sent to Beaver Safety.</p>
      <p id="save-status" role="status"></p>
    </form>
  </template>
</body>
</html>
